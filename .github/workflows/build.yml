name: Build ioquake3 for Miyoo Mini

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ioq3_ref:
        description: "ioquake3 branch, tag or commit to build"
        required: false
        default: "main"

env:
  TOOLCHAIN_REPO: shauninman/union-miyoomini-toolchain
  TOOLCHAIN_IMAGE: miyoomini-toolchain
  IOQ3_REF: ${{ github.event.inputs.ioq3_ref || 'main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout this repo (Makefile)
        uses: actions/checkout@v4

      - name: Checkout ioquake3 source
        uses: actions/checkout@v4
        with:
          repository: Sakura-Research-Lab/ioq3-mm
          ref: ${{ env.IOQ3_REF }}
          path: ioq3

      - name: Checkout Miyoo Mini toolchain definition
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TOOLCHAIN_REPO }}
          path: toolchain

      - name: Build toolchain Docker image
        run: docker build -t "$TOOLCHAIN_IMAGE" toolchain

      - name: Cross-compile ioquake3 inside the toolchain container
        run: |
          docker run --rm \
            -v "$PWD":/work -w /work \
            -e IOQ3_REF \
            "$TOOLCHAIN_IMAGE" \
            /bin/bash -euxo pipefail -c '
              # Locate the cross compiler and sysroot inside the image
              GCC_PATH=$(find /opt -type f -name "arm-*-gcc" 2>/dev/null | head -n1)
              test -n "$GCC_PATH" || { echo "No ARM gcc found in /opt"; exit 1; }
              CROSS_PREFIX="${GCC_PATH%gcc}"
              SYSROOT=$("${CROSS_PREFIX}gcc" -print-sysroot)
              if [ -z "$SYSROOT" ] || [ ! -d "$SYSROOT" ]; then
                SYSROOT=$(dirname "$(dirname "$(find /opt -type d -name libc -path "*arm*" | head -n1)")")/libc
              fi
              echo "CROSS=$CROSS_PREFIX"
              echo "SYSROOT=$SYSROOT"

              # Prefer SDL2 if the sysroot has it, otherwise fall back to SDL 1.2
              SDL_CFG=$(find "$SYSROOT" /opt -type f -name sdl2-config 2>/dev/null | head -n1)
              [ -n "$SDL_CFG" ] || SDL_CFG=$(find "$SYSROOT" /opt -type f -name sdl-config 2>/dev/null | head -n1)
              echo "SDL_CONFIG=$SDL_CFG"

              make SKIP_FETCH=1 \
                   CROSS="$CROSS_PREFIX" \
                   SYSROOT="$SYSROOT" \
                   SDL_CONFIG="$SDL_CFG"
            '

      - name: Fix file ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" . || true

      - name: Create archive
        run: |
          cd dist
          zip -r ../ioquake3-miyoomini.zip ioquake3

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ioquake3-miyoomini
          path: ioquake3-miyoomini.zip
          if-no-files-found: error

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ioquake3-miyoomini.zip
