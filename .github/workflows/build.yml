name: Build ioquake3 for Miyoo Mini

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ioq3_ref:
        description: "ioquake3 branch, tag or commit to build"
        required: false
        default: "main"
      sdl2_ref:
        description: "XK9274/sdl2_miyoo branch, tag or commit"
        required: false
        default: "main"

env:
  IOQ3_REF: ${{ github.event.inputs.ioq3_ref || 'main' }}
  SDL2_REF: ${{ github.event.inputs.sdl2_ref || 'main' }}
  MIYOO_TC: /opt/miyoomini-toolchain
  DEPS_PREFIX: ${{ github.workspace }}/deps

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Clone ioquake3 source
        run: |
          git clone https://github.com/ioquake/ioq3.git ioq3-src
          git -C ioq3-src checkout "$IOQ3_REF"
          echo "ioq3 commit: $(git -C ioq3-src rev-parse HEAD)"

      - name: Clone Miyoo SDL2 source
        run: |
          git clone https://github.com/XK9274/sdl2_miyoo.git sdl2-src
          git -C sdl2-src checkout "$SDL2_REF"
          echo "sdl2_miyoo commit: $(git -C sdl2-src rev-parse HEAD)"

      # The SDL2 build script clones XK9274/union-miyoomini-toolchain, builds
      # it as the Docker image "miyoomini-toolchain", and compiles SDL2 inside it.
      - name: Build Miyoo SDL2 (with GLES/EGL)
        run: |
          cd sdl2-src
          ./build-scripts/mk_miyoo.sh --docker --enable-gles
          ls -la output
          ls include/SDL_config.h

      # ioq3 needs CMake >= 3.25, which that old image lacks, so copy the
      # cross toolchain out of the image and run the runner's CMake instead.
      - name: Extract cross toolchain from the image
        run: |
          docker create --name tc miyoomini-toolchain
          sudo docker cp tc:/opt/miyoomini-toolchain /opt/
          docker rm tc
          "$MIYOO_TC/bin/arm-linux-gnueabihf-gcc" --version

      - name: Stage SDL2 as a CMake package
        run: |
          mkdir -p "$DEPS_PREFIX/include/SDL2" "$DEPS_PREFIX/lib/cmake/SDL2"
          cp sdl2-src/include/*.h "$DEPS_PREFIX/include/SDL2/"
          cp sdl2-src/output/libSDL2-2.0.so.0 "$DEPS_PREFIX/lib/"
          ln -sf libSDL2-2.0.so.0 "$DEPS_PREFIX/lib/libSDL2.so"
          for f in libEGL.so libGLESv2.so libneonarmmiyoo.so; do
            [ -f "sdl2-src/$f" ] && cp "sdl2-src/$f" "$DEPS_PREFIX/lib/" || true
          done
          cat > "$DEPS_PREFIX/lib/cmake/SDL2/SDL2Config.cmake" <<'CMAKE'
          get_filename_component(_prefix "${CMAKE_CURRENT_LIST_DIR}/../../.." ABSOLUTE)
          set(SDL2_FOUND TRUE)
          set(SDL2_INCLUDE_DIRS "${_prefix}/include/SDL2")
          set(SDL2_LIBRARIES "${_prefix}/lib/libSDL2.so")
          set(SDL2_CFLAGS_OTHER "")
          CMAKE
          sed -i 's/^          //' "$DEPS_PREFIX/lib/cmake/SDL2/SDL2Config.cmake"
          ls -la "$DEPS_PREFIX/lib"

      - name: Configure ioquake3
        run: |
          cmake -S ioq3-src -B ioq3-build -G "Unix Makefiles" \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/cmake/miyoomini.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$DEPS_PREFIX" \
            -DCMAKE_EXE_LINKER_FLAGS="-Wl,--allow-shlib-undefined" \
            -DBUILD_SERVER=OFF \
            -DBUILD_RENDERER_GL2=OFF \
            -DBUILD_GAME_QVMS=OFF \
            -DUSE_RENDERER_DLOPEN=OFF \
            -DUSE_OPENAL=OFF -DUSE_HTTP=OFF \
            -DUSE_CODEC_VORBIS=OFF -DUSE_CODEC_OPUS=OFF \
            -DUSE_VOIP=OFF -DUSE_MUMBLE=OFF -DUSE_FREETYPE=OFF \
            -DUSE_INTERNAL_LIBS=ON

      - name: Build ioquake3
        run: cmake --build ioq3-build -j"$(nproc)"

      - name: Package
        run: |
          OUT=dist/ioquake3
          mkdir -p "$OUT/baseq3" "$OUT/lib"
          BIN=$(find ioq3-build -type f -name 'ioquake3*' ! -name '*.so' ! -name '*.o' | head -n1)
          echo "client binary: $BIN"
          test -n "$BIN"
          cp "$BIN" "$OUT/ioquake3"
          find ioq3-build -type f \( -name 'cgame*.so' -o -name 'qagame*.so' -o -name 'ui*.so' \) \
            -exec cp {} "$OUT/baseq3/" \;
          cp -a "$DEPS_PREFIX"/lib/*.so* "$OUT/lib/"
          cp package/baseq3/autoexec.cfg "$OUT/baseq3/"
          cp package/launch.sh "$OUT/"
          "$MIYOO_TC/bin/arm-linux-gnueabihf-strip" "$OUT/ioquake3" "$OUT"/baseq3/*.so || true
          chmod +x "$OUT/ioquake3" "$OUT/launch.sh"
          echo "Copy your own pak0.pk3 into baseq3/ (not included)" > "$OUT/README.txt"
          (cd dist && zip -r ../ioquake3-miyoomini.zip ioquake3)

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ioquake3-miyoomini
          path: ioquake3-miyoomini.zip
          if-no-files-found: error

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ioquake3-miyoomini.zip
