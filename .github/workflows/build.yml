name: Build ioquake3 for Miyoo Mini

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ioq3_ref:
        description: "ioquake3 branch, tag or commit to build"
        required: false
        default: "main"

env:
  TOOLCHAIN_REPO: shauninman/union-miyoomini-toolchain
  TOOLCHAIN_IMAGE: miyoomini-toolchain
  IOQ3_REF: ${{ github.event.inputs.ioq3_ref || 'main' }}
  SDL2_TAG: release-2.30.9
  MIYOO_TC: /opt/miyoomini-toolchain
  DEPS_PREFIX: ${{ github.workspace }}/deps

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Clone ioquake3 source
        run: |
          git clone https://github.com/ioquake/ioq3.git ioq3-src
          git -C ioq3-src checkout "$IOQ3_REF"
          echo "ioq3 commit: $(git -C ioq3-src rev-parse HEAD)"

      - name: Clone toolchain definition
        run: git clone --depth 1 https://github.com/${TOOLCHAIN_REPO}.git toolchain

      # ioq3 now needs CMake >= 3.25, which the (old Debian) toolchain image
      # lacks. So we build the image, copy the cross toolchain out of it, and
      # run the modern CMake from the runner.
      - name: Build toolchain image and extract cross toolchain
        run: |
          docker build -t "$TOOLCHAIN_IMAGE" toolchain
          docker create --name tc "$TOOLCHAIN_IMAGE"
          sudo docker cp tc:/opt/miyoomini-toolchain /opt/
          docker rm tc
          "$MIYOO_TC/bin/arm-linux-gnueabihf-gcc" --version
          ls "$MIYOO_TC/arm-linux-gnueabihf/libc"

      - name: Cross-compile SDL2
        run: |
          git clone --depth 1 --branch "$SDL2_TAG" https://github.com/libsdl-org/SDL.git sdl2-src
          cmake -S sdl2-src -B sdl2-build -G "Unix Makefiles" \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/cmake/miyoomini.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$DEPS_PREFIX" \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TEST=OFF
          cmake --build sdl2-build -j"$(nproc)"
          cmake --install sdl2-build

      - name: Configure ioquake3
        run: |
          cmake -S ioq3-src -B ioq3-build -G "Unix Makefiles" \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/cmake/miyoomini.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$DEPS_PREFIX" \
            -DBUILD_SERVER=OFF \
            -DBUILD_RENDERER_GL2=OFF \
            -DBUILD_GAME_QVMS=OFF \
            -DUSE_RENDERER_DLOPEN=OFF \
            -DUSE_OPENAL=OFF -DUSE_HTTP=OFF \
            -DUSE_CODEC_VORBIS=OFF -DUSE_CODEC_OPUS=OFF \
            -DUSE_VOIP=OFF -DUSE_MUMBLE=OFF -DUSE_FREETYPE=OFF \
            -DUSE_INTERNAL_LIBS=ON

      - name: Build ioquake3
        run: cmake --build ioq3-build -j"$(nproc)"

      - name: Package
        run: |
          OUT=dist/ioquake3
          mkdir -p "$OUT/baseq3" "$OUT/lib"
          BIN=$(find ioq3-build -type f -name 'ioquake3*' ! -name '*.so' ! -name '*.o' | head -n1)
          echo "client binary: $BIN"
          test -n "$BIN"
          cp "$BIN" "$OUT/ioquake3"
          find ioq3-build -type f \( -name 'cgame*.so' -o -name 'qagame*.so' -o -name 'ui*.so' \) \
            -exec cp {} "$OUT/baseq3/" \;
          cp -a "$DEPS_PREFIX"/lib/libSDL2*.so* "$OUT/lib/"
          cp package/baseq3/autoexec.cfg "$OUT/baseq3/"
          cp package/launch.sh "$OUT/"
          "$MIYOO_TC/bin/arm-linux-gnueabihf-strip" "$OUT/ioquake3" "$OUT"/baseq3/*.so || true
          chmod +x "$OUT/ioquake3" "$OUT/launch.sh"
          echo "Copy your own pak0.pk3 into baseq3/ (not included)" > "$OUT/README.txt"
          (cd dist && zip -r ../ioquake3-miyoomini.zip ioquake3)

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ioquake3-miyoomini
          path: ioquake3-miyoomini.zip
          if-no-files-found: error

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ioquake3-miyoomini.zip
