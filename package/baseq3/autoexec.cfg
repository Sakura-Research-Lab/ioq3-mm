unbindall

// D-Pad: move
bind UPARROW    "+forward"
bind DOWNARROW  "+back"
bind LEFTARROW  "+moveleft"
bind RIGHTARROW "+moveright"

// Face buttons: look
bind CTRL  "+right"
bind ALT   "+lookdown"
bind SHIFT "+lookup"
bind SPACE "+left"

// Triggers / bumpers
bind BACKSPACE "+attack"
bind TAB       "+zoom"
bind e         "weapnext"
bind t         "weapprev"

// System
bind ENTER  "togglemenu"
bind ESCAPE "togglemenu"

seta cl_yawspeed   "180"
seta cl_pitchspeed "140"
seta cl_run        "1"

// Light settings
seta r_mode        "3"
seta r_fullscreen  "1"
seta r_picmip      "2"
seta r_vertexLight "1"
seta com_maxfps    "30"
seta s_initsound   "0"
